[[headers]]
for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "no-referrer"
  Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
for = "/service-worker.js"
  [headers.values]
  Cache-Control = "no-cache"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
